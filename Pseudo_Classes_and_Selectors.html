<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    button:hover{
        background-color: rgb(202, 91, 11);
        color: beige;
       
    }

    ul>li{
         background-color: brown;
        
    }

    button+h1{
        background-color: rgb(199, 140, 255);
        border: 4px double;
    }

    ul li:nth-child(1){
        border: 5px dotted rgb(240, 240, 70);
    }

    h2::first-letter{
         border: 4px solid;
         background-color: antiquewhite;
         color: blueviolet;
    }
</style>
</head>
<body>
    <button >Click</button>
    <h1>Today we are learning Pseudo Elements.</h1>
    <ul>
        <li>Uniform</li>
        <li>School Bag</li>
        <li>Books</li>
    </ul>
    <h2>Let's do this</h2>
</body>
</html>
